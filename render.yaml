databases:
  - name: fintrack-pro-db
    databaseName: fintrack_db
    user: fintrack_user
    plan: free
    region: oregon

services:
  - type: web
    name: fintrack-pro-app
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-pro-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: fintrack-pro-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DEFAULT_AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: PRIMARY_PAYMENT_GATEWAY
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

